name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Pint, PHPStan, Pest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Tested against the floor of composer.json's "php": "^8.3"
          # constraint, not whatever happens to be on a dev machine.
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, curl
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: php vendor/bin/pint --test

      - name: PHPStan (static analysis)
        run: php vendor/bin/phpstan analyse --no-progress

      - name: Pest (tests)
        run: php artisan test --compact
